<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patients Directory - KEEP UP</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .filter-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .search-input-wrapper {
      position: relative;
      flex: 1;
      min-width: 250px;
    }
    .search-input {
      width: 100%;
      padding: 10px 16px 10px 36px;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--card-border);
      border-radius: var(--border-radius-sm);
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: var(--transition);
    }
    .search-input:focus {
      border-color: var(--color-primary);
      background: rgba(15, 23, 42, 0.6);
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 16px;
      height: 16px;
      pointer-events: none;
    }
    .action-icons-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .action-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: var(--border-radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
    }
    .action-icon-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
    }
    .action-icon-btn.btn-view:hover {
      color: var(--color-info);
      border-color: rgba(14, 165, 233, 0.3);
    }
    .action-icon-btn.btn-edit:hover {
      color: var(--color-warning);
      border-color: rgba(245, 158, 11, 0.3);
    }
    .action-icon-btn.btn-archive:hover {
      color: var(--color-danger);
      border-color: rgba(239, 68, 68, 0.3);
    }
    .action-icon-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar Overlay (Mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar Drawer -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand-logo">
          <svg style="width: 24px; height: 24px; fill: #fff;" viewBox="0 0 24 24">
            <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
          </svg>
        </div>
        <span class="sidebar-brand-name">Keep Up</span>
      </div>

      <div class="sidebar-user">
        <div class="user-avatar" id="layout-user-initials">--</div>
        <div class="user-info">
          <div class="user-name" id="layout-user-name">Loading...</div>
          <span class="user-role-badge" id="layout-user-role">---</span>
        </div>
      </div>

      <!-- Dynamic navigation links based on role -->
      <ul class="sidebar-nav" id="layout-nav-links">
        <!-- Injected dynamically by JS -->
      </ul>

      <div class="sidebar-footer">
        <button class="logout-btn" id="logout-btn">
          <svg viewBox="0 0 24 24">
            <path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/>
          </svg>
          Sign Out
        </button>
      </div>
    </aside>

    <!-- Main View Area -->
    <main class="main-content">
      <!-- Mobile Header -->
      <header class="mobile-header">
        <button class="menu-toggle" id="menu-toggle">
          <svg viewBox="0 0 24 24">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
          </svg>
        </button>
        <span class="sidebar-brand-name">Keep Up</span>
        <div style="width: 32px; height: 32px; font-size: 13px;" class="user-avatar" id="mobile-user-initials">--</div>
      </header>

      <!-- Content Section -->
      <div class="content-card glass-panel" style="margin-top: 20px;">
        <div class="card-title-section">
          <div>
            <h2 class="card-title">Centralized Patients Directory</h2>
            <p class="card-subtitle">Browse centralized patient information sheets, vaccination history, and consult files.</p>
          </div>
          <!-- Only records staff can add patient -->
          <div id="add-patient-btn-container" style="display: none;">
            <a href="/dashboard/patients/add" class="btn btn-primary">
              <svg style="width: 18px; height: 18px; fill: currentColor;" viewBox="0 0 24 24">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
              </svg>
              Add New Patient
            </a>
          </div>
        </div>

        <!-- Search and Filter -->
        <div class="filter-bar">
          <div class="search-input-wrapper">
            <input type="text" class="search-input" id="search-patients" placeholder="Search by name, patient number, or PhilHealth number...">
            <svg class="search-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          </div>
        </div>

        <!-- Patients Table -->
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Patient No.</th>
                <th>Full Name</th>
                <th>Birth Date</th>
                <th>Sex</th>
                <th>Address</th>
                <th>Contact</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="patients-table-body">
              <tr>
                <td colspan="8" style="text-align: center; color: var(--text-muted); padding: 40px;">
                  Loading patient records...
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script>
    let allPatients = [];
    let currentUser = null;

    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Load user profile details
      currentUser = await loadUserProfile();
      if (!currentUser) return;

      // 2. Set mobile header initials
      const mobileInitials = document.getElementById('mobile-user-initials');
      if (mobileInitials && currentUser.full_name) {
        mobileInitials.textContent = currentUser.full_name
          .split(' ')
          .map(n => n[0])
          .join('')
          .substring(0, 2)
          .toUpperCase();
      }

      // 3. Inject Navigation Links based on user role
      injectSidebarLinks(currentUser.role);

      // 4. Role check for writing actions
      if (currentUser.role === 'RECORDS_STAFF') {
        document.getElementById('add-patient-btn-container').style.display = 'block';
      }

      // 5. Fetch patient directory list
      await fetchAndRenderPatients();

      // 6. Client-Side Search
      document.getElementById('search-patients').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase().trim();
        filterPatients(query);
      });

      // 7. Logout handler
      document.getElementById('logout-btn').addEventListener('click', async () => {
        if (confirm('Are you sure you want to log out of the KEEP UP System?')) {
          await API.logout();
        }
      });
    });

    // Dynamically write navigation links to ensure correct sidebar structure
    function injectSidebarLinks(role) {
      const navContainer = document.getElementById('layout-nav-links');
      let linksHtml = '';

      if (role === 'RHU_ADMINISTRATOR') {
        linksHtml = `
          <li>
            <a href="/dashboard/admin" class="nav-link">
              <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
              Dashboard Overview
            </a>
          </li>
          <li>
            <a href="/dashboard/admin/users" class="nav-link">
              <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
              User Accounts
            </a>
          </li>
          <li>
            <a href="/dashboard/patients" class="nav-link active">
              <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
              Patient Directory
            </a>
          </li>
          <li>
            <a href="/dashboard/search" class="nav-link">
              <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
              Unified Search
            </a>
          </li>
          <li>
            <a href="/dashboard/duplicates" class="nav-link">
              <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
              Duplicate Warnings
            </a>
          </li>
          <li>
            <a href="/dashboard/reports" class="nav-link">
              <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
              Reports Dashboard
            </a>
          </li>
        `;
      } else if (role === 'RECORDS_STAFF') {
        linksHtml = `
          <li>
            <a href="/dashboard/records" class="nav-link">
              <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
              Dashboard Overview
            </a>
          </li>
          <li>
            <a href="/dashboard/patients" class="nav-link active">
              <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
              Patient Directory
            </a>
          </li>
          <li>
            <a href="/dashboard/search" class="nav-link">
              <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
              Unified Search
            </a>
          </li>
          <li>
            <a href="/dashboard/duplicates" class="nav-link">
              <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
              Duplicate Warnings
            </a>
          </li>
          <li>
            <a href="/dashboard/reports" class="nav-link">
              <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
              Reports Dashboard
            </a>
          </li>
        `;
      } else if (role === 'HEALTHCARE_PERSONNEL') {
        linksHtml = `
          <li>
            <a href="/dashboard/healthcare" class="nav-link">
              <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
              Dashboard Overview
            </a>
          </li>
          <li>
            <a href="/dashboard/patients" class="nav-link active">
              <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
              Patient Directory
            </a>
          </li>
          <li>
            <a href="/dashboard/search" class="nav-link">
              <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
              Unified Search
            </a>
          </li>
        `;
      }

      navContainer.innerHTML = linksHtml;
    }

    // Load active patients list
    async function fetchAndRenderPatients() {
      try {
        const res = await API.fetchJson('/api/patients');
        if (res && res.success) {
          allPatients = res.patients;
          renderPatientsTable(allPatients);
        }
      } catch (error) {
        showToast('Error loading centralized patient list.', 'error');
      }
    }

    // Render table rows dynamically based on role permissions
    function renderPatientsTable(patientsList) {
      const tableBody = document.getElementById('patients-table-body');

      if (patientsList.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="8" style="text-align: center; color: var(--text-muted); padding: 40px;">
              No active patient records found.
            </td>
          </tr>
        `;
        return;
      }

      const isRecordsStaff = currentUser.role === 'RECORDS_STAFF';

      tableBody.innerHTML = patientsList.map(patient => {
        const fullName = `${patient.first_name} ${patient.middle_name ? patient.middle_name + ' ' : ''}${patient.last_name}`;
        
        // Render actions based on role: Records Staff has edit & archive, others only view
        let actionsHtml = `
          <a href="/dashboard/patients/profile/${patient.id}" class="action-icon-btn btn-view" title="View Patient Profile">
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </a>
        `;

        if (isRecordsStaff) {
          actionsHtml = `
            <div class="action-icons-group">
              <a href="/dashboard/patients/profile/${patient.id}" class="action-icon-btn btn-view" title="View Profile">
                <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
              </a>
              <a href="/dashboard/records/upload/${patient.id}" class="action-icon-btn btn-scan" title="Scan / Upload File" style="color: var(--color-success); background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.15); display: inline-flex; align-items: center; justify-content: center;">
                <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; fill: currentColor;"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
              </a>
              <a href="/dashboard/patients/edit/${patient.id}" class="action-icon-btn btn-edit" title="Edit Patient Details">
                <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
              </a>
              <button onclick="handleArchivePatient('${patient.id}', '${escapeJs(fullName)}')" class="action-icon-btn btn-archive" title="Archive Record">
                <svg viewBox="0 0 24 24"><path d="M20.54 5.23l-1.39-1.68C18.88 3.21 18.47 3 18 3H6c-.47 0-.88.21-1.16.55L3.46 5.23C3.17 5.57 3 6.01 3 6.5V19c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6.5c0-.49-.17-.93-.46-1.27zM12 17.5L6.5 12H10v-3h4v3h3.5L12 17.5zM5.12 5l.82-1h12.06l.82 1H5.12z"/></svg>
              </button>
            </div>
          `;
        }

        return `
          <tr id="row-${patient.id}">
            <td style="font-weight: 700; color: var(--color-primary);">${escapeHtml(patient.patient_number)}</td>
            <td style="font-weight: 600;">${escapeHtml(fullName)}</td>
            <td>${formatDate(patient.birth_date)}</td>
            <td><span class="badge" style="background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); color: #fff;">${escapeHtml(patient.sex)}</span></td>
            <td style="color: var(--text-secondary); max-width: 200px; text-overflow: ellipsis; white-space: nowrap; overflow: hidden;">${escapeHtml(patient.address)}</td>
            <td style="color: var(--text-secondary);">${escapeHtml(patient.contact_number || 'N/A')}</td>
            <td>
              <span class="badge badge-active">${patient.status}</span>
            </td>
            <td>${actionsHtml}</td>
          </tr>
        `;
      }).join('');
    }

    // Filter table records client-side
    function filterPatients(query) {
      if (!query) {
        renderPatientsTable(allPatients);
        return;
      }
      const filtered = allPatients.filter(p => {
        const fullName = `${p.first_name} ${p.middle_name ? p.middle_name + ' ' : ''}${p.last_name}`.toLowerCase();
        return fullName.includes(query) || 
               p.patient_number.toLowerCase().includes(query) ||
               (p.philhealth_number && p.philhealth_number.toLowerCase().includes(query));
      });
      renderPatientsTable(filtered);
    }

    // Soft-Delete Archive endpoint caller
    async function handleArchivePatient(id, name) {
      if (!confirm(`Are you sure you want to ARCHIVE the record of patient "${name}"?\nThis record will be removed from the active directory but preserved in the archive.`)) {
        return;
      }

      try {
        const res = await API.fetchJson(`/api/patients/${id}/archive`, { method: 'PUT' });
        if (res && res.success) {
          showToast(res.message, 'success');
          // Remove from local cache and re-render
          allPatients = allPatients.filter(p => p.id !== id);
          renderPatientsTable(allPatients);
        }
      } catch (error) {
        showToast(error.message || 'Failed to archive patient record.', 'error');
      }
    }

    // Formatting date helper
    function formatDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }

    // Simple HTML Escaper
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
    }

    // Simple Javascript String Escaper for inline functions
    function escapeJs(str) {
      if (!str) return '';
      return str.replace(/'/g, "\\'")
                .replace(/"/g, '\\"');
    }
  </script>
</body>
</html>
