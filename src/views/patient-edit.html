<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="/images/LOGO.jpg">
  <link rel="shortcut icon" href="/images/LOGO.jpg">
  <title>Edit Patient - KEEP UP</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .card-section {
      background: var(--card-bg, rgba(20, 24, 36, 0.75));
      border: 1px solid var(--card-border, rgba(255, 255, 255, 0.08));
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-primary, #ffffff);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-icon {
      width: 20px;
      height: 20px;
      fill: var(--color-primary, #6366f1);
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 16px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 16px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 16px;
    }

    .grid-1 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    @media (max-width: 992px) {
      .grid-4 { grid-template-columns: repeat(2, 1fr); }
      .grid-3 { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 576px) {
      .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; }
    }

    .required-star {
      color: #ef4444;
      font-weight: bold;
      margin-left: 3px;
    }

    .read-only-badge {
      background: rgba(255, 255, 255, 0.05) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      color: var(--text-muted, #9ca3af) !important;
      font-weight: 600;
      cursor: not-allowed;
    }

    .patient-id-container {
      background: rgba(99, 102, 241, 0.08);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .patient-id-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary, #94a3b8);
    }

    .patient-id-input {
      font-family: monospace;
      font-size: 15px;
      font-weight: 700;
      color: var(--color-primary, #6366f1);
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 6px 14px;
      border-radius: 6px;
      width: 220px;
      text-align: center;
    }

    .input-prefix-group {
      display: flex;
      align-items: center;
    }

    .input-prefix-badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-right: none;
      border-top-left-radius: 6px;
      border-bottom-left-radius: 6px;
      padding: 0 12px;
      height: 42px;
      display: flex;
      align-items: center;
      color: var(--text-secondary, #94a3b8);
      font-weight: 600;
      font-size: 14px;
    }

    .input-prefix-group input {
      border-top-left-radius: 0 !important;
      border-bottom-left-radius: 0 !important;
    }

    .radio-group {
      display: flex;
      align-items: center;
      gap: 24px;
      height: 42px;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-primary, #f3f4f6);
      user-select: none;
    }

    .radio-label input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: var(--color-primary, #6366f1);
      cursor: pointer;
    }

    .form-actions-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 16px;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .btn-cancel {
      background: transparent;
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #ef4444;
      padding: 10px 24px;
      border-radius: 8px;
      font-weight: 600;
      transition: all 0.2s ease;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-cancel:hover {
      background: rgba(239, 68, 68, 0.12);
      border-color: #ef4444;
      color: #f87171;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar Overlay (Mobile) -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar Drawer -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand-logo">
          <img src="/images/LOGO.jpg" alt="RHU Paete Logo">
        </div>
        <span class="sidebar-brand-name">Keep Up</span>
      </div>

      <div class="sidebar-user">
        <div class="user-avatar" id="layout-user-initials">--</div>
        <div class="user-info">
          <div class="user-name" id="layout-user-name">Loading...</div>
          <span class="user-role-badge" id="layout-user-role">---</span>
        </div>
      </div>

      <!-- Dynamic navigation links -->
      <ul class="sidebar-nav" id="layout-nav-links">
        <!-- Injected dynamically by JS -->
      </ul>

      <div class="sidebar-footer">
        <button class="logout-btn" id="logout-btn">
          <svg viewBox="0 0 24 24">
            <path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/>
          </svg>
          Sign Out
        </button>
      </div>
    </aside>

    <!-- Main View Area -->
    <main class="main-content">
      <!-- Mobile Header -->
      <header class="mobile-header">
        <button class="menu-toggle" id="menu-toggle">
          <svg viewBox="0 0 24 24">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
          </svg>
        </button>
        <span class="sidebar-brand-name">Keep Up</span>
        <div style="width: 32px; height: 32px; font-size: 13px;" class="user-avatar" id="mobile-user-initials">--</div>
      </header>

      <!-- Main Form Container -->
      <div style="margin-top: 20px; max-width: 1000px;">
        <div class="content-card glass-panel" style="margin-bottom: 20px; padding: 20px 24px;">
          <div class="card-title-section" style="margin-bottom: 0;">
            <div>
              <h2 class="card-title">Edit Patient Record</h2>
              <p class="card-subtitle">Modify patient details for <strong style="color: var(--color-primary);" id="patient-number-title">PAT-XXXX</strong>.</p>
            </div>
          </div>
        </div>

        <form id="edit-patient-form" style="margin-top: 10px;">
          
          <!-- CARD A: PATIENT IDENTIFICATION -->
          <div class="card-section">
            <div class="section-header">
              <svg class="section-icon" viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
              <h3 class="section-title">A. Patient Identification</h3>
            </div>

            <div class="patient-id-container">
              <span class="patient-id-label">Patient ID / Record No.:</span>
              <input type="text" id="patient_number" class="patient-id-input read-only-badge" readonly tabindex="-1">
            </div>

            <!-- Profile Picture Upload -->
            <div class="form-group" style="margin-bottom: 20px;">
              <label class="form-label" for="photo_file">Patient Profile Picture (Optional)</label>
              <div style="display: flex; align-items: center; gap: 15px;">
                <div style="width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--card-border, #cbd5e1); background: #F5F7FA; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0;" id="edit-photo-preview-box">
                  <span id="photo-placeholder" style="font-size: 20px; color: #64748b;">📷</span>
                  <img id="photo-img-preview" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                </div>
                <input type="file" id="photo_file" accept="image/jpeg,image/png,image/webp" class="form-input" style="padding: 8px 12px; line-height: 1;">
              </div>
            </div>

            <!-- Row 2: Pangalan (4 Columns) -->
            <div class="grid-4">
              <div class="form-group">
                <label class="form-label" for="first_name">First Name<span class="required-star">*</span></label>
                <input class="form-input" style="padding-left: 14px;" type="text" id="first_name" required tabindex="1">
              </div>
              <div class="form-group">
                <label class="form-label" for="middle_name">Middle Name</label>
                <input class="form-input" style="padding-left: 14px;" type="text" id="middle_name" tabindex="2">
              </div>
              <div class="form-group">
                <label class="form-label" for="last_name">Last Name<span class="required-star">*</span></label>
                <input class="form-input" style="padding-left: 14px;" type="text" id="last_name" required tabindex="3">
              </div>
              <div class="form-group">
                <label class="form-label" for="suffix">Suffix</label>
                <select class="form-select" id="suffix" tabindex="4">
                  <option value="">None</option>
                  <option value="Jr.">Jr.</option>
                  <option value="Sr.">Sr.</option>
                  <option value="II">II</option>
                  <option value="III">III</option>
                  <option value="IV">IV</option>
                  <option value="V">V</option>
                </select>
              </div>
            </div>

            <!-- Row 3: Personal Info (4 Columns) -->
            <div class="grid-4">
              <div class="form-group">
                <label class="form-label" for="birth_date">Date of Birth<span class="required-star">*</span></label>
                <input class="form-input" style="padding-left: 14px; cursor: pointer;" type="date" id="birth_date" required tabindex="5">
              </div>
              <div class="form-group">
                <label class="form-label" for="age">Age</label>
                <input class="form-input read-only-badge" style="padding-left: 14px;" type="text" id="age" placeholder="Auto-calculated" readonly tabindex="-1">
              </div>
              <div class="form-group">
                <label class="form-label" for="sex">Sex<span class="required-star">*</span></label>
                <select class="form-select" id="sex" required tabindex="6">
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label" for="civil_status">Civil Status</label>
                <select class="form-select" id="civil_status" tabindex="7">
                  <option value="">Select Status</option>
                  <option value="Single">Single</option>
                  <option value="Married">Married</option>
                  <option value="Widowed">Widowed</option>
                  <option value="Separated">Separated</option>
                  <option value="Divorced">Divorced</option>
                </select>
              </div>
            </div>

            <!-- Row 4: Background (3 Columns) -->
            <div class="grid-3">
              <div class="form-group">
                <label class="form-label" for="place_of_birth">Place of Birth</label>
                <input class="form-input" style="padding-left: 14px;" type="text" id="place_of_birth" tabindex="8">
              </div>
              <div class="form-group">
                <label class="form-label" for="religion">Religion</label>
                <input class="form-input" style="padding-left: 14px;" type="text" id="religion" tabindex="9">
              </div>
              <div class="form-group">
                <label class="form-label" for="nationality">Nationality</label>
                <input class="form-input" style="padding-left: 14px;" type="text" id="nationality" value="Filipino" tabindex="10">
              </div>
            </div>
          </div>


          <!-- CARD B: CONTACT & ADDRESS -->
          <div class="card-section">
            <div class="section-header">
              <svg class="section-icon" viewBox="0 0 24 24">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
              </svg>
              <h3 class="section-title">B. Contact & Address</h3>
            </div>

            <!-- Row 1: Lokal na Address (2 Columns) -->
            <div class="grid-2">
              <div class="form-group">
                <label class="form-label" for="house_street_purok">House No. / Street / Purok</label>
                <input class="form-input" style="padding-left: 14px;" type="text" id="house_street_purok" tabindex="11">
              </div>
              <div class="form-group">
                <label class="form-label" for="barangay">Barangay</label>
                <select class="form-select" id="barangay" tabindex="12">
                  <option value="" disabled selected>Select Barangay</option>
                </select>
                <input type="text" class="form-input" id="custom_barangay" placeholder="Type Barangay name" style="display:none; margin-top: 8px;">
              </div>
            </div>

            <!-- Row 2: Lungsod at Probinsya (2 Columns) -->
            <div class="grid-2">
              <div class="form-group">
                <label class="form-label" for="city_municipality">Municipality / City</label>
                <select class="form-select" id="city_municipality" tabindex="13">
                  <option value="" disabled selected>Select City / Municipality</option>
                </select>
                <input type="text" class="form-input" id="custom_city" placeholder="Type Municipality / City name" style="display:none; margin-top: 8px;">
              </div>
              <div class="form-group">
                <label class="form-label" for="province">Province</label>
                <select class="form-select" id="province" tabindex="14">
                  <option value="" disabled selected>Select Province</option>
                </select>
                <input type="text" class="form-input" id="custom_province" placeholder="Type Province name" style="display:none; margin-top: 8px;">
              </div>
            </div>

            <!-- Row 3: Contact (1 Column) -->
            <div class="grid-1">
              <div class="form-group">
                <label class="form-label" for="contact_number">Contact Number<span class="required-star">*</span></label>
                <div class="input-prefix-group">
                  <div class="input-prefix-badge">+63</div>
                  <input class="form-input" style="padding-left: 14px;" type="text" id="contact_number" required tabindex="15" maxlength="11">
                </div>
              </div>
            </div>
          </div>


          <!-- CARD C: SOCIO-ECONOMIC DATA -->
          <div class="card-section">
            <div class="section-header">
              <svg class="section-icon" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 16h-2v-2h2v2zm1.07-7.75l-.9.92C12.45 11.9 12 12.5 12 14h-2v-.5c0-1.1.45-2.1 1.17-2.83l1.24-1.26c.37-.36.59-.86.59-1.41 0-1.1-.9-2-2-2s-2 .9-2 2H7c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.04-.42 1.99-1.07 2.75z"/>
              </svg>
              <h3 class="section-title">C. Socio-economic Data</h3>
            </div>

            <div class="grid-2">
              <div class="form-group">
                <label class="form-label" for="occupation">Occupation</label>
                <input class="form-input" style="padding-left: 14px;" type="text" id="occupation" tabindex="16">
              </div>
              <div class="form-group">
                <label class="form-label" for="philhealth_number">PhilHealth Number</label>
                <input class="form-input" style="padding-left: 14px;" type="text" id="philhealth_number" tabindex="17" maxlength="14">
              </div>
            </div>

            <div class="grid-2">
              <div class="form-group">
                <label class="form-label" for="philhealth_category">PhilHealth Category</label>
                <select class="form-select" id="philhealth_category" tabindex="18">
                  <option value="">Select Category</option>
                  <option value="Direct Contributor">Direct Contributor</option>
                  <option value="Indirect Contributor">Indirect Contributor</option>
                  <option value="Senior Citizen">Senior Citizen</option>
                  <option value="PWD">PWD (Person with Disability)</option>
                  <option value="Indigent">Indigent</option>
                  <option value="Dependent">Dependent</option>
                  <option value="N/A">N/A / Non-Member</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">4Ps Beneficiary</label>
                <div class="radio-group">
                  <label class="radio-label">
                    <input type="radio" name="is_4ps_beneficiary" value="Yes" id="4ps_yes" tabindex="19">
                    <span>Yes</span>
                  </label>
                  <label class="radio-label">
                    <input type="radio" name="is_4ps_beneficiary" value="No" id="4ps_no" checked tabindex="20">
                    <span>No</span>
                  </label>
                </div>
              </div>
            </div>
          </div>


          <!-- CARD D: EMERGENCY CONTACT -->
          <div class="card-section" style="border-color: rgba(99, 102, 241, 0.25);">
            <div class="section-header">
              <svg class="section-icon" viewBox="0 0 24 24">
                <path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
              </svg>
              <h3 class="section-title">D. Emergency Contact</h3>
            </div>

            <div class="grid-2">
              <div class="form-group">
                <label class="form-label" for="emergency_contact_name">Emergency Contact Name</label>
                <input class="form-input" style="padding-left: 14px;" type="text" id="emergency_contact_name" tabindex="21">
              </div>
              <div class="form-group">
                <label class="form-label" for="emergency_relationship">Relationship to Patient</label>
                <select class="form-select" id="emergency_relationship" tabindex="22">
                  <option value="">Select Relationship</option>
                  <option value="Parent">Parent</option>
                  <option value="Spouse">Spouse</option>
                  <option value="Child">Child</option>
                  <option value="Sibling">Sibling</option>
                  <option value="Guardian">Guardian</option>
                  <option value="Relative">Relative</option>
                  <option value="Other">Other</option>
                </select>
              </div>
            </div>

            <div class="grid-1">
              <div class="form-group">
                <label class="form-label" for="emergency_contact_number">Emergency Contact Number</label>
                <div class="input-prefix-group">
                  <div class="input-prefix-badge">+63</div>
                  <input class="form-input" style="padding-left: 14px;" type="text" id="emergency_contact_number" tabindex="23" maxlength="11">
                </div>
              </div>
            </div>
          </div>


          <!-- Bottom Right Actions -->
          <div class="form-actions-bar">
            <a href="/dashboard/patients" class="btn-cancel" tabindex="24">Cancel</a>
            <button class="btn btn-primary" type="submit" id="save-btn" tabindex="25">
              <svg viewBox="0 0 24 24" style="width: 18px; height: 18px; fill: currentColor; margin-right: 6px;">
                <path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/>
              </svg>
              <span class="btn-text">Save Changes</span>
              <span class="spinner"></span>
            </button>
          </div>

        </form>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script>
    const ALL_PROVINCES = [
      "Abra", "Agusan del Norte", "Agusan del Sur", "Aklan", "Albay", "Antique", "Apayao", "Aurora",

      "Cotabato (North Cotabato)", "Davao de Oro (Compostela Valley)", "Davao del Norte", "Davao del Sur", 
      "Davao Occidental", "Davao Oriental", "Dinagat Islands", "Eastern Samar", "Guimaras", "Ifugao", 
      "Ilocos Norte", "Ilocos Sur", "Iloilo", "Isabela", "Kalinga", "La Union", "Laguna", "Lanao del Norte",

      "Metro Manila (NCR)", "Misamis Occidental", "Misamis Oriental", "Mountain Province", "Negros Occidental", 
      "Negros Oriental", "Northern Samar", "Nueva Ecija", "Nueva Vizcaya", "Occidental Mindoro", "Oriental Mindoro", 
      "Palawan", "Pampanga", "Pangasinan", "Quezon", "Quirino", "Rizal", "Romblon", "Samar (Western Samar)", 
      "Sarangani", "Siquijor", "Sorsogon", "South Cotabato", "Southern Leyte", "Sultan Kudarat", "Sulu", 
      "Surigao del Norte", "Surigao del Sur", "Tarlac", "Tawi-Tawi", "Zambales", "Zamboanga del Norte", 
      "Zamboanga del Sur", "Zamboanga Sibugay"
    ];

    const PSGC_DATA = {
      "Laguna": {

    let currentUser = null;
    let patientId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const pathParts = window.location.pathname.split('/');
      patientId = pathParts[pathParts.length - 1];

      if (!patientId) {
        showToast('Invalid request URL. Missing patient identifier.', 'error');
        setTimeout(() => { window.location.href = '/dashboard/patients'; }, 2000);
        return;
      }

      currentUser = await loadUserProfile();
      if (!currentUser) return;

      if (currentUser.role !== 'RECORDS_STAFF' && currentUser.role !== 'ADMINISTRATIVE_STAFF') {
        window.location.href = '/dashboard/patients?error=unauthorized';
        return;
      }

      const mobileInitials = document.getElementById('mobile-user-initials');
      if (mobileInitials && currentUser.full_name) {
        mobileInitials.textContent = currentUser.full_name
          .split(' ')
          .map(n => n[0])
          .join('')
          .substring(0, 2)
          .toUpperCase();
      }

      injectSidebarLinks(currentUser.role);
      setupInputMasks();
      setupAddressSelectDropdowns();
      await loadPatientData();

      const birthDateInput = document.getElementById('birth_date');
      const ageInput = document.getElementById('age');

      birthDateInput.addEventListener('change', () => {
        const age = calculateAge(birthDateInput.value);
        ageInput.value = age !== '' ? `${age} yrs old` : '';
      });

      const editForm = document.getElementById('edit-patient-form');
      const saveBtn = document.getElementById('save-btn');

      editForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const first_name = document.getElementById('first_name').value;
        const middle_name = document.getElementById('middle_name').value;
        const last_name = document.getElementById('last_name').value;
        const suffix = document.getElementById('suffix').value;
        const birth_date = document.getElementById('birth_date').value;
        const sex = document.getElementById('sex').value;
        const civil_status = document.getElementById('civil_status').value;
        const place_of_birth = document.getElementById('place_of_birth').value;
        const religion = document.getElementById('religion').value;
        const nationality = document.getElementById('nationality').value;

        const house_street_purok = document.getElementById('house_street_purok').value;
        
        const provSelect = document.getElementById('province').value;
        const province = (provSelect === 'Other') 
          ? document.getElementById('custom_province').value 
          : provSelect;

        const citySelect = document.getElementById('city_municipality').value;
        const city_municipality = (citySelect === 'Other' || provSelect === 'Other') 
          ? document.getElementById('custom_city').value 
          : citySelect;

        const brgySelect = document.getElementById('barangay').value;
        const barangay = (brgySelect === 'Other' || citySelect === 'Other' || provSelect === 'Other') 
          ? document.getElementById('custom_barangay').value 
          : brgySelect;

        const rawContact = document.getElementById('contact_number').value.trim();
        const contact_number = rawContact ? `+63${rawContact}` : '';

        const occupation = document.getElementById('occupation').value;
        const philhealth_number = document.getElementById('philhealth_number').value;
        const philhealth_category = document.getElementById('philhealth_category').value;
        
        const beneficiaryRadio = document.querySelector('input[name="is_4ps_beneficiary"]:checked');
        const is_4ps_beneficiary = beneficiaryRadio ? beneficiaryRadio.value : 'No';

        const emergency_contact_name = document.getElementById('emergency_contact_name').value;
        const emergency_relationship = document.getElementById('emergency_relationship').value;
        
        const rawEmergencyContact = document.getElementById('emergency_contact_number').value.trim();
        const emergency_contact_number = rawEmergencyContact ? `+63${rawEmergencyContact}` : '';

        const constructedAddress = [house_street_purok, barangay, city_municipality, province]
          .filter(Boolean)
          .map(s => s.trim())
          .join(', ');
        const address = constructedAddress || 'N/A';

        saveBtn.classList.add('loading');
        saveBtn.disabled = true;

        try {
          const res = await API.fetchJson(`/api/patients/${patientId}`, {
            method: 'PUT',
            body: JSON.stringify({
              first_name,
              middle_name,
              last_name,
              suffix,
              birth_date,
              sex,
              civil_status,
              place_of_birth,
              religion,
              nationality,
              house_street_purok,
              barangay,
              city_municipality,
              province,
              address,
              contact_number,
              occupation,
              philhealth_number,
              philhealth_category,
              is_4ps_beneficiary,
              emergency_contact_name,
              emergency_relationship,
              emergency_contact_number
            })
          });

          if (res && res.success) {
            const photoFileInput = document.getElementById('photo_file');
            if (photoFileInput && photoFileInput.files && photoFileInput.files[0]) {
              const photoData = new FormData();
              photoData.append('photo', photoFileInput.files[0]);
              try {
                await API.postForm(`/api/patients/${patientId}/photo`, photoData);
              } catch (_) {}
            }

            showToast(res.message || 'Patient record updated successfully.', 'success');
            setTimeout(() => {
              window.location.href = '/dashboard/patients';
            }, 1000);
          }
        } catch (error) {
          showToast(error.message || 'Failed to update patient profile.', 'error');
          saveBtn.classList.remove('loading');
          saveBtn.disabled = false;
        }
      });
    });

    async function loadPatientData() {
      try {
        const res = await API.fetchJson(`/api/patients/${patientId}`);
        if (res && res.success && res.patient) {
          const p = res.patient;
          document.getElementById('patient-number-title').textContent = p.patient_number;
          document.getElementById('patient_number').value = p.patient_number;

          if (p.photo_url) {
            const imgPreview = document.getElementById('photo-img-preview');
            const placeholder = document.getElementById('photo-placeholder');
            if (imgPreview && placeholder) {
              imgPreview.src = p.photo_url;
              imgPreview.style.display = 'block';
              placeholder.style.display = 'none';
            }
          }

          document.getElementById('first_name').value = p.first_name || '';
          document.getElementById('middle_name').value = p.middle_name || '';
          document.getElementById('last_name').value = p.last_name || '';
          document.getElementById('suffix').value = p.suffix || '';

          if (p.birth_date) {
            const bDateStr = new Date(p.birth_date).toISOString().split('T')[0];
            document.getElementById('birth_date').value = bDateStr;
            const age = calculateAge(bDateStr);
            document.getElementById('age').value = age !== '' ? `${age} yrs old` : '';
          }

          document.getElementById('sex').value = p.sex || '';
          document.getElementById('civil_status').value = p.civil_status || '';
          document.getElementById('place_of_birth').value = p.place_of_birth || '';
          document.getElementById('religion').value = p.religion || '';
          document.getElementById('nationality').value = p.nationality || 'Filipino';

          document.getElementById('house_street_purok').value = p.house_street_purok || '';
          
          // Populate Province select
          const provSelect = document.getElementById('province');
          const citySelect = document.getElementById('city_municipality');
          const brgySelect = document.getElementById('barangay');

          if (p.province) {
            let foundProv = Array.from(provSelect.options).some(opt => opt.value === p.province);
            if (foundProv) {
              provSelect.value = p.province;
              provSelect.dispatchEvent(new Event('change'));
            } else {
              provSelect.value = 'Other';
              provSelect.dispatchEvent(new Event('change'));
              document.getElementById('custom_province').value = p.province;
            }
          }

          if (p.city_municipality) {
            let foundCity = Array.from(citySelect.options).some(opt => opt.value === p.city_municipality);
            if (foundCity) {
              citySelect.value = p.city_municipality;
              citySelect.dispatchEvent(new Event('change'));
            } else {
              citySelect.value = 'Other';
              citySelect.dispatchEvent(new Event('change'));
              document.getElementById('custom_city').value = p.city_municipality;
            }
          }

          if (p.barangay) {
            let foundBrgy = Array.from(brgySelect.options).some(opt => opt.value === p.barangay);
            if (foundBrgy) {
              brgySelect.value = p.barangay;
            } else {
              brgySelect.value = 'Other';
              brgySelect.dispatchEvent(new Event('change'));
              document.getElementById('custom_barangay').value = p.barangay;
            }
          }

          if (p.contact_number) {
            document.getElementById('contact_number').value = p.contact_number.replace(/^\+63/, '');
          }

          document.getElementById('occupation').value = p.occupation || '';
          document.getElementById('philhealth_number').value = p.philhealth_number || '';
          document.getElementById('philhealth_category').value = p.philhealth_category || '';

          if (p.is_4ps_beneficiary === 'Yes') {
            document.getElementById('4ps_yes').checked = true;
          } else {
            document.getElementById('4ps_no').checked = true;
          }

          document.getElementById('emergency_contact_name').value = p.emergency_contact_name || '';
          document.getElementById('emergency_relationship').value = p.emergency_relationship || '';
          if (p.emergency_contact_number) {
            document.getElementById('emergency_contact_number').value = p.emergency_contact_number.replace(/^\+63/, '');
          }
        }
      } catch (err) {
        showToast('Failed to load patient data.', 'error');
      }
    }

    function calculateAge(birthDateString) {
      if (!birthDateString) return '';
      const birthDate = new Date(birthDateString);
      if (isNaN(birthDate.getTime())) return '';
      const today = new Date();
      let age = today.getFullYear() - birthDate.getFullYear();
      const m = today.getMonth() - birthDate.getMonth();
      if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
        age--;
      }
      return age >= 0 ? age : 0;
    }

    function setupAddressSelectDropdowns() {
      const provSelect = document.getElementById('province');
      const citySelect = document.getElementById('city_municipality');
      const brgySelect = document.getElementById('barangay');

      const customProv = document.getElementById('custom_province');
      const customCity = document.getElementById('custom_city');
      const customBrgy = document.getElementById('custom_barangay');

      provSelect.innerHTML = '<option value="" disabled selected>Select Province</option>';
      ALL_PROVINCES.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        provSelect.appendChild(opt);
      });
      const optOtherProv = document.createElement('option');
      optOtherProv.value = 'Other';
      optOtherProv.textContent = 'Other / Type Custom Location';
      provSelect.appendChild(optOtherProv);

      provSelect.addEventListener('change', () => {
        const selProv = provSelect.value;
        citySelect.innerHTML = '<option value="" disabled selected>Select City / Municipality</option>';
        brgySelect.innerHTML = '<option value="" disabled selected>Select Barangay</option>';

        if (selProv === 'Other') {
          customProv.style.display = 'block';
          customCity.style.display = 'block';
          customBrgy.style.display = 'block';
          citySelect.value = '';
          brgySelect.value = '';
          citySelect.disabled = true;
          brgySelect.disabled = true;
          return;
        }

        customProv.style.display = 'none';
        customCity.style.display = 'none';
        customBrgy.style.display = 'none';
        citySelect.disabled = false;
        brgySelect.disabled = false;

        if (PSGC_DATA[selProv]) {
          const cities = Object.keys(PSGC_DATA[selProv]);
          cities.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c;
            opt.textContent = c;
            citySelect.appendChild(opt);
          });
        }

        const optOtherCity = document.createElement('option');
        optOtherCity.value = 'Other';
        optOtherCity.textContent = 'Other / Type Custom Municipality';
        citySelect.appendChild(optOtherCity);
      });

      citySelect.addEventListener('change', () => {
        const selProv = provSelect.value;
        const selCity = citySelect.value;

        brgySelect.innerHTML = '<option value="" disabled selected>Select Barangay</option>';

        if (selCity === 'Other') {
          customCity.style.display = 'block';
          customBrgy.style.display = 'block';
          brgySelect.value = '';
          brgySelect.disabled = true;
          return;
        }

        customCity.style.display = 'none';
        customBrgy.style.display = 'none';
        brgySelect.disabled = false;

        if (selProv && selCity && PSGC_DATA[selProv] && PSGC_DATA[selProv][selCity]) {
          const barangays = PSGC_DATA[selProv][selCity];
          barangays.forEach(b => {
            const opt = document.createElement('option');
            opt.value = b;
            opt.textContent = b;
            brgySelect.appendChild(opt);
          });
        }

        const optOtherBrgy = document.createElement('option');
        optOtherBrgy.value = 'Other';
        optOtherBrgy.textContent = 'Other / Type Custom Barangay';
        brgySelect.appendChild(optOtherBrgy);
      });

      brgySelect.addEventListener('change', () => {
        if (brgySelect.value === 'Other') {
          customBrgy.style.display = 'block';
        } else {
          customBrgy.style.display = 'none';
        }
      });
    }

    function setupInputMasks() {
      const contactInput = document.getElementById('contact_number');
      const emergencyContactInput = document.getElementById('emergency_contact_number');
      const philhealthInput = document.getElementById('philhealth_number');

      [contactInput, emergencyContactInput].forEach(input => {
        input.addEventListener('input', (e) => {
          e.target.value = e.target.value.replace(/[^0-9]/g, '').slice(0, 11);
        });
      });

      philhealthInput.addEventListener('input', (e) => {
        const rawDigits = e.target.value.replace(/\D/g, '').slice(0, 12);
        let formatted = '';
        if (rawDigits.length > 0) formatted += rawDigits.slice(0, 2);
        if (rawDigits.length > 2) formatted += '-' + rawDigits.slice(2, 11);
        if (rawDigits.length > 11) formatted += '-' + rawDigits.slice(11, 12);
        e.target.value = formatted;
      });

      const photoFileInput = document.getElementById('photo_file');
      if (photoFileInput) {
        photoFileInput.addEventListener('change', (e) => {
          const file = e.target.files[0];
          const imgPreview = document.getElementById('photo-img-preview');
          const placeholder = document.getElementById('photo-placeholder');
          if (file) {
            imgPreview.src = URL.createObjectURL(file);
            imgPreview.style.display = 'block';
            if (placeholder) placeholder.style.display = 'none';
          }
        });
      }
    }


  </script>
