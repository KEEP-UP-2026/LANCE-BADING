<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/jpeg" href="/images/LOGO.jpg">
  <link rel="shortcut icon" href="/images/LOGO.jpg">
  <title>RHU Paete - Patient Records Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    /* RHU Paete Custom Premium Design */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #171226;
      overflow-x: hidden;
    }

    .rhu-login-wrapper {
      position: relative;
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.72) 0%, rgba(30, 10, 20, 0.68) 50%, rgba(15, 23, 42, 0.75) 100%), url('/images/RHU_BUILDING.png') no-repeat center center fixed;
      background-size: cover;
      overflow: hidden;
    }

    /* 3D Floating Blurred Orbs */
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(65px);
      pointer-events: none;
      opacity: 0.55;
    }

    .orb-1 {
      width: 480px;
      height: 480px;
      top: -110px;
      left: -120px;
      background: radial-gradient(circle, #e11d48 0%, rgba(225, 29, 72, 0) 70%);
      animation: floatOrb 12s ease-in-out infinite alternate;
    }

    .orb-2 {
      width: 520px;
      height: 520px;
      bottom: -160px;
      right: -100px;
      background: radial-gradient(circle, #3b82f6 0%, rgba(59, 130, 246, 0) 70%);
      animation: floatOrb 15s ease-in-out infinite alternate-reverse;
    }

    .orb-3 {
      width: 360px;
      height: 360px;
      bottom: 15%;
      left: 20%;
      background: radial-gradient(circle, #6366f1 0%, rgba(99, 102, 241, 0) 70%);
      opacity: 0.35;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(35px, 25px) scale(1.06); }
    }

    .rhu-card {
      position: relative;
      width: 100%;
      max-width: 410px;
      background: #e3e5ee;
      border-radius: 28px;
      padding: 42px 34px 34px;
      box-shadow: 0 35px 70px -15px rgba(0, 0, 0, 0.5), 0 0 25px rgba(0, 0, 0, 0.15);
      box-sizing: border-box;
      z-index: 10;
      overflow: hidden;
    }

    .rhu-brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .rhu-logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      background: #fde8e8;
      border-radius: 18px;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.1);
    }

    .rhu-logo-badge svg {
      width: 28px;
      height: 28px;
    }

    .rhu-title {
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 6px;
      letter-spacing: -0.02em;
    }

    .rhu-subtitle {
      font-size: 13.5px;
      color: #64748b;
      font-weight: 500;
      margin: 0;
      letter-spacing: -0.01em;
    }

    .rhu-form-group {
      position: relative;
      margin-bottom: 16px;
    }

    .rhu-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .rhu-input-icon {
      position: absolute;
      left: 18px;
      width: 20px;
      height: 20px;
      fill: #94a3b8;
      pointer-events: none;
      transition: fill 0.2s ease;
    }

    .rhu-input {
      width: 100%;
      height: 52px;
      background: #f1f3f9;
      border: 1.5px solid transparent;
      border-radius: 16px;
      padding: 0 18px 0 48px;
      font-size: 14.5px;
      font-weight: 500;
      color: #0f172a;
      outline: none;
      box-sizing: border-box;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .rhu-input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    .rhu-input:focus {
      background: #ffffff;
      border-color: #dc2626;
      box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.12);
    }

    .rhu-input:focus + .rhu-input-icon,
    .rhu-input-wrapper:focus-within .rhu-input-icon {
      fill: #dc2626;
    }

    .rhu-submit-btn {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      border: none;
      border-radius: 16px;
      font-size: 15.5px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 8px 20px rgba(220, 38, 38, 0.35);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
    }

    .rhu-submit-btn:hover {
      background: linear-gradient(135deg, #f87171, #ef4444);
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(220, 38, 38, 0.45);
    }

    .rhu-submit-btn:active {
      transform: translateY(0);
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
    }

    .rhu-submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .rhu-footer-text {
      text-align: center;
      margin-top: 26px;
      font-size: 11px;
      color: #64748b;
      line-height: 1.5;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="rhu-login-wrapper">
    <!-- 3D Orbs -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <div class="rhu-card">
      <div class="rhu-brand-header">
        <div class="rhu-logo-badge" style="background: transparent; box-shadow: none; width: auto; height: auto; margin-bottom: 12px;">
          <img src="/images/LOGO.jpg" alt="RHU Paete Logo" style="width: 76px; height: 76px; object-fit: cover; border-radius: 50%; box-shadow: 0 10px 25px -4px rgba(0,0,0,0.22); border: 3px solid #FFFFFF;">
        </div>
        <h1 class="rhu-title">RHU Paete</h1>
        <p class="rhu-subtitle">Patient Records Management System</p>
      </div>

      <form id="login-form">
        <div class="rhu-form-group">
          <div class="rhu-input-wrapper">
            <input 
              class="rhu-input" 
              type="text" 
              id="email" 
              placeholder="Username" 
              required
              autocomplete="username"
            >
            <svg class="rhu-input-icon" viewBox="0 0 24 24">
              <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
          </div>
        </div>

        <div class="rhu-form-group">
          <div class="rhu-input-wrapper">
            <input 
              class="rhu-input" 
              type="password" 
              id="password" 
              placeholder="Password" 
              required
              autocomplete="current-password"
            >
            <svg class="rhu-input-icon" viewBox="0 0 24 24">
              <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
            </svg>
          </div>
        </div>

        <button class="rhu-submit-btn" type="submit" id="submit-btn">
          Sign In
        </button>
      </form>

      <div class="rhu-footer-text">
        Secure access restricted to authorized personnel only.<br>
        Compliant with Data Privacy Act of 2012.
      </div>
    </div>
  </div>

  <!-- Script tags -->
  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('login-form');
      const submitBtn = document.getElementById('submit-btn');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');

      // Check query parameter errors on load (like account_disabled or session expired)
      const urlParams = new URLSearchParams(window.location.search);
      const errorParam = urlParams.get('error');
      if (errorParam === 'account_disabled') {
        showToast('Access Denied: Account is disabled.', 'error');
        // Clean URL
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      // Prefetch CSRF token for login POST
      API.ensureCsrfToken().catch(() => {});

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        // Frontend validation
        if (!email || !password) {
          showToast('Please enter both your username/email address and password.', 'warning');
          return;
        }

        // Add loading state
        submitBtn.disabled = true;
        submitBtn.textContent = 'Signing in...';

        try {
          const res = await API.login(email, password);
          if (res && res.success) {
            showToast(res.message, 'success');
            // Wait slightly for success toast to animate
            setTimeout(() => {
              window.location.href = res.redirectUrl;
            }, 800);
          }
        } catch (error) {
          showToast(error.message || 'Login failed. Please try again.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      });
    });
  </script>
</body>
</html>
